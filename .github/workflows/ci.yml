name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned deliberately. Unpinned linters make CI fail on the tool
      # vendor's release schedule rather than on a change to this repo:
      # ruff 0.16 promoted UP045/RUF059 to defaults and turned master red
      # with 95 findings on code that had not changed. Bump these
      # intentionally, in a PR that also carries the resulting fixes.
      - run: pip install ruff==0.15.17 bandit==1.9.4
      - run: ruff check src/ tests/
      - run: bandit -r src/ -ll

  test:
    name: Tests & CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-layer4.txt -r requirements-phase2.txt
      - name: pytest
        run: pytest tests/ -v --cov=src
      - name: pip-audit
        # Audit the installed environment — avoids build-from-source failures on sdist-only packages
        run: pip-audit
